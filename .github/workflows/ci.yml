name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dev dependencies
        # Install without marker-pdf (heavy ML deps) for CI speed.
        # marker_single absence is handled gracefully in tests via subprocess mock.
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" --no-deps
          pip install typer rich pymupdf pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check src/ tests/ scripts/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/ scripts/

      - name: Run tests
        run: pytest --tb=short -q

      - name: Coverage report
        if: matrix.python-version == '3.14'
        run: pytest --cov=pdf_markdown --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  lint-only:
    name: Lint (ruff, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
