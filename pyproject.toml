[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-markdown"
version = "0.1.0"
description = "A reusable CLI to convert PDFs to Markdown using Marker, with image-extraction fallback."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "pdf-markdown contributors" }]
keywords = ["pdf", "markdown", "ocr", "cli", "marker", "conversion", "document"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pymupdf>=1.24.0",    # fitz — for fallback image extraction
    "marker-pdf>=0.3.0",  # datalab-to/marker
]

[project.urls]
Homepage       = "https://github.com/your-org/pdf-markdown"
Repository     = "https://github.com/your-org/pdf-markdown"
"Bug Tracker"  = "https://github.com/your-org/pdf-markdown/issues"
Changelog      = "https://github.com/your-org/pdf-markdown/blob/main/CHANGELOG.md"

[project.scripts]
pdf-markdown = "pdf_markdown.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_markdown"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # do not warn on typer.Option/Argument in function defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -q"

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source  = ["pdf_markdown"]
omit    = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
